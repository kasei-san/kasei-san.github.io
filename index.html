<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かせいさんとこ</title>
<meta name="description" content="かせいさんの個人サークル「かせいさんとこ」。ボイスドラマをつくっています。">
<meta name="theme-color" content="#0a0c26">
<meta property="og:type" content="website">
<meta property="og:title" content="かせいさんとこ">
<meta property="og:description" content="かせいさんの個人サークル。ボイスドラマをつくっています。">
<meta property="og:url" content="https://kasei-san.com/">
<meta name="twitter:site" content="@kasei_san">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a0c26;
    --ink: #f0f3ff;
    --ink-dim: #c9d0f0;
    --gold: #ffe2a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    background: var(--night);
    color: var(--ink);
    font-family: "Shippori Mincho", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  /* position: fixed (not background-attachment: fixed) so it also holds on iOS Safari */
  .sky { position: fixed; inset: 0; z-index: -1; }
  .sky img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
  .sky::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(10, 12, 38, 0.2), rgba(10, 12, 38, 0.75));
  }

  main {
    flex: 1;
    width: 100%; max-width: 720px; margin: 0 auto;
    padding: clamp(56px, 12vh, 140px) 24px 40px;
    text-align: center;
    text-shadow: 0 0 0.5em rgba(6, 8, 30, 0.95), 0 0 1.2em rgba(6, 8, 30, 0.7);
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 7vw, 56px); font-weight: 800; letter-spacing: 0.18em; text-indent: 0.18em;
  }
  .about {
    margin: 28px 0 0; font-size: clamp(15px, 2.2vw, 17px); line-height: 2.1; letter-spacing: 0.08em; color: var(--ink-dim);
  }
  .about span { display: inline-block; }

  .works { margin: clamp(48px, 9vh, 110px) 0 0; }
  .work + .work { margin-top: 72px; }
  .works h2 {
    margin: 0 0 20px; font-size: 13px; font-weight: 500; letter-spacing: 0.4em; text-indent: 0.4em; color: var(--gold);
  }
  .work a { display: block; color: inherit; text-decoration: none; }
  .work img {
    display: block; width: min(480px, 100%); height: auto; margin: 0 auto;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 20, 0.8));
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  .work a:hover img, .work a:focus-visible img {
    transform: translateY(-4px);
    filter: drop-shadow(0 6px 14px rgba(0, 0, 20, 0.8)) drop-shadow(0 0 18px rgba(160, 180, 255, 0.45));
  }
  .work a:focus-visible { outline: none; }
  .work .meta { margin-top: 18px; font-size: 14px; line-height: 1.9; color: var(--ink-dim); letter-spacing: 0.1em; }
  .work .meta b { color: var(--gold); font-weight: 700; margin: 0 0.25em; }
  .work .more { display: inline-block; margin-top: 6px; font-size: 13px; letter-spacing: 0.2em; color: var(--ink); }
  .work .more::after { content: " →"; }

  footer {
    padding: 32px 24px calc(28px + env(safe-area-inset-bottom));
    text-align: center; font-size: 13px; color: var(--ink-dim); letter-spacing: 0.08em;
  }
  footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid rgba(201, 208, 240, 0.35); }
  footer a:hover { color: #fff; border-bottom-color: #fff; }

  .sparkle { position: fixed; z-index: -1; width: var(--s); height: var(--s); }
  .sparkle::before {
    content: ""; position: absolute; inset: 0; background: #fff0c8;
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
    filter: drop-shadow(0 0 4px rgba(255, 240, 200, 0.9));
    animation: twinkle 3.2s ease-in-out infinite; animation-delay: var(--d, 0s);
  }
  @keyframes twinkle { 0%, 100% { transform: scale(0.75); opacity: 0.55; } 50% { transform: scale(1.1); opacity: 1; } }
  .s1 { left: 12vw; top: 14vh; --s: 18px; }
  .s2 { left: 84vw; top: 22vh; --s: 13px; --d: 1.1s; }
  .s3 { left: 76vw; top: 78vh; --s: 15px; --d: 0.6s; }
  .s4 { left: 8vw; top: 70vh; --s: 11px; --d: 1.9s; }
  @media (prefers-reduced-motion: reduce) { .sparkle::before { animation: none; } .work img { transition: none; } }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <picture>
    <source media="(max-aspect-ratio: 1/1)" srcset="assets/bg_port.jpg">
    <img src="assets/bg_land.jpg" alt="">
  </picture>
</div>
<i class="sparkle s1" aria-hidden="true"></i><i class="sparkle s2" aria-hidden="true"></i>
<i class="sparkle s3" aria-hidden="true"></i><i class="sparkle s4" aria-hidden="true"></i>

<main>
  <h1>かせいさんとこ</h1>
  <p class="about"><span>かせいさんの個人サークルです。</span><span>ボイスドラマをつくっています。</span></p>

  <section class="works" aria-labelledby="works-h">
    <h2 id="works-h">作品</h2>
    <!-- 旧作は .work を足していく -->
    <div class="work">
      <a href="imouto-mamechishiki/">
        <img src="imouto-mamechishiki/img/logo.webp" alt="ボイスドラマ 妹が布団に入ってきて眠れなくなる豆知識を吹き込んでくるので眠れない" width="1400" height="723">
        <div class="meta">ボイスドラマ第二弾<br>2026秋M3<b>B-13a</b>頒布</div>
        <span class="more">詳しく見る</span>
      </a>
    </div>
  </section>
</main>

<footer>
  <a href="https://x.com/kasei_san" target="_blank" rel="noopener">X @kasei_san</a>
</footer>

</body>
</html>
