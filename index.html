<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かせいさんとこ</title>
<meta name="description" content="かせいさんの個人サークル「かせいさんとこ」。ボイスドラマをつくっています。">
<meta name="theme-color" content="#18181b">
<meta property="og:type" content="website">
<meta property="og:title" content="かせいさんとこ">
<meta property="og:description" content="かせいさんの個人サークル。ボイスドラマをつくっています。">
<meta property="og:url" content="https://kasei-san.com/">
<meta name="twitter:site" content="@kasei_san">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Neutral on purpose: no work's palette. Yellow is the one colour both logos share. */
  :root {
    --bg: #18181b;
    --ink: #f4f4f5;
    --ink-dim: #a1a1aa;
    --accent: #facc15;
    --rule: rgba(244, 244, 245, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }

  main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: clamp(56px, 11vh, 120px) 24px 48px; }

  header { text-align: center; }
  h1 {
    display: inline-block; margin: 0;
    font-size: clamp(38px, 7.5vw, 68px); font-weight: 900; letter-spacing: 0.06em; line-height: 1.2;
    /* marker-style underline in the accent colour */
    background: linear-gradient(transparent 80%, var(--accent) 80%, var(--accent) 97%, transparent 97%);
    padding: 0 0.12em;
  }
  h1 + p { margin: 22px 0 0; color: var(--ink-dim); font-size: clamp(14px, 2vw, 16px); line-height: 1.9; letter-spacing: 0.06em; }
  h1 + p span { display: inline-block; }

  .works { margin-top: clamp(56px, 10vh, 104px); }
  .works h2 {
    margin: 0 0 36px; display: flex; align-items: center; gap: 16px;
    font-size: 15px; font-weight: 900; letter-spacing: 0.3em; color: var(--accent);
  }
  .works h2::after { content: ""; flex: 1; height: 2px; background: var(--rule); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 56px 48px; }
  .work a { display: block; color: inherit; text-decoration: none; }
  .work .logo {
    display: grid; place-items: center; aspect-ratio: 2 / 1;
  }
  .work img {
    display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
    transition: transform 0.25s ease;
  }
  .work a:hover img, .work a:focus-visible img { transform: translateY(-4px) rotate(-1deg); }
  .work a:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 4px; }
  .work .no { margin: 22px 0 0; font-size: 13px; font-weight: 900; letter-spacing: 0.2em; color: var(--accent); }
  .work .title { margin: 6px 0 0; font-size: clamp(17px, 2vw, 19px); font-weight: 700; line-height: 1.6; }
  .work .info { margin: 8px 0 0; font-size: 14px; color: var(--ink-dim); line-height: 1.8; }
  .work .go {
    display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 700;
    border-bottom: 2px solid var(--accent); padding-bottom: 2px;
  }

  footer { padding: 28px 24px calc(28px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--ink-dim); }
  footer a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid rgba(161, 161, 170, 0.45); }
  footer a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { .work img { transition: none; } }
</style>
</head>
<body>

<main>
  <header>
    <h1>かせいさんとこ</h1>
    <p><span>かせいさんの個人サークルです。</span><span>ボイスドラマをつくっています。</span></p>
  </header>

  <section class="works" aria-labelledby="works-h">
    <h2 id="works-h">作品</h2>
    <div class="grid">
      <!-- 新しい順。作品を足すときは .work を先頭に追加する -->
      <article class="work">
        <a href="imouto-mamechishiki/">
          <div class="logo"><img src="imouto-mamechishiki/img/logo.webp" alt="" width="1400" height="723"></div>
          <p class="no">ボイスドラマ 第二弾</p>
          <p class="title">妹が布団に入ってきて眠れなくなる豆知識を吹き込んでくるので眠れない</p>
          <p class="info">2026秋M3 B-13a にて頒布</p>
          <span class="go">作品ページへ →</span>
        </a>
      </article>
      <article class="work">
        <a href="https://dlaf.jp/home/dlaf/=/t/s/link/work/aid/kasei_san/id/RJ01535087.html" target="_blank" rel="noopener sponsored">
          <div class="logo"><img src="assets/works/kasu-no-onesan.webp" alt="" width="1200" height="562" loading="lazy"></div>
          <p class="no">ボイスドラマ 第一弾</p>
          <p class="title">いろいろな法律を犯すカスのお姉さん</p>
          <p class="info">DLsite にて販売中</p>
          <span class="go">DLsite で見る →</span>
        </a>
      </article>
    </div>
  </section>
</main>

<footer>
  <a href="https://x.com/kasei_san" target="_blank" rel="noopener">X @kasei_san</a>
</footer>

</body>
</html>
